name: Desktop Release
run-name: "Append desktop ${{ inputs.release_tag }}${{ inputs.publish_update_manifest && ' + updater feed' || '' }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub Release tag (for example v2.7.5)'
        required: true
        type: string
      publish_update_manifest:
        description: 'Publish latest.json for this release (only use for the newest desktop version)'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'Type APPEND-DESKTOP to confirm modifying an existing Release'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate existing Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate confirmation, tag, and existing assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PUBLISH_UPDATE_MANIFEST: ${{ inputs.publish_update_manifest }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'APPEND-DESKTOP' ]; then
            echo 'The confirmation input must be APPEND-DESKTOP.' >&2
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'release_tag must use the vX.Y.Z format.' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing_assets" | grep -Eiq '(^latest\.json$|^SHA256SUMS-desktop\.txt$|^desktop-build-metadata\.json$|\.dmg$|\.msi$|-setup\.exe$|macOS-universal\.zip$|\.(app\.tar\.gz|nsis\.zip|msi\.zip)(\.sig)?$)'; then
            echo "Release $RELEASE_TAG already contains desktop assets; refusing to overwrite them." >&2
            exit 1
          fi
          if [ "$PUBLISH_UPDATE_MANIFEST" = 'true' ]; then
            latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
            if [ "$latest_tag" != "$RELEASE_TAG" ]; then
              echo "Updater manifest must be attached to the latest Release ($latest_tag), not $RELEASE_TAG." >&2
              exit 1
            fi
          fi
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate desktop source
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck and test app
        run: |
          yarn workspace happy-app typecheck
          yarn workspace happy-app test --run

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: [preflight, validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_script: tauri:build:windows:x64
          - arch: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            build_script: tauri:build:windows:arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Validate updater signing Secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required secret: TAURI_SIGNING_PRIVATE_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing required secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          }

      - name: Build unsigned Windows installers and signed updater archives
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $env:TAURI_CONFIG = @{ version = $env:APP_VERSION } | ConvertTo-Json -Compress
          yarn workspace happy-app ${{ matrix.build_script }} --ci

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $bundle = "packages/happy-app/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          $stage = "packages/happy-app/desktop-release-artifacts"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Name -match '\.(msi|exe|zip|sig)$' } |
            Copy-Item -Destination $stage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: packages/happy-app/desktop-release-artifacts/*

  build-macos:
    name: Build signed and notarized macOS Universal
    needs: [preflight, validate]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Validate signing Secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            ASC_API_KEY_ID \
            ASC_API_KEY_P8_BASE64 \
            ASC_ISSUER_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/happy-next-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

      - name: Prepare App Store Connect key for notarization
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

      - name: Build, sign, and notarize macOS Universal bundle
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export TAURI_CONFIG="{\"version\":\"$APP_VERSION\"}"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          yarn workspace happy-app tauri:build:macos:universal --ci

      - name: Notarize and staple macOS disk image
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify signature, notarization, stapling, and Gatekeeper
        run: |
          APP_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" && test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Package and stage macOS artifacts
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          BUNDLE_DIR="packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle"
          STAGE_DIR="packages/happy-app/desktop-release-artifacts"
          APP_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -print -quit)"
          mkdir -p "$STAGE_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$STAGE_DIR/Happy-Next-${APP_VERSION}-macOS-universal.zip"
          find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -exec cp {} "$STAGE_DIR" \;
          find "$BUNDLE_DIR/macos" -maxdepth 1 -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} "$STAGE_DIR" \;

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos-universal
          if-no-files-found: error
          path: packages/happy-app/desktop-release-artifacts/*

      - name: Remove temporary signing material
        if: always()
        env:
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/happy-next-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  append-release:
    name: Append desktop assets to ${{ inputs.release_tag }}
    needs: [preflight, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate metadata and optional updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PUBLISH_UPDATE_MANIFEST: ${{ inputs.publish_update_manifest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            '{version: $version, release_tag: $release_tag, source_sha: $source_sha, source_ref: $source_ref}' \
            > artifacts/desktop-build-metadata.json
          if [ "$PUBLISH_UPDATE_MANIFEST" = 'true' ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
              > "$RUNNER_TEMP/release-notes.md"
            node packages/happy-app/sources/scripts/generateDesktopUpdateManifest.cjs \
              --version "$VERSION" \
              --release-tag "$RELEASE_TAG" \
              --repository "$GITHUB_REPOSITORY" \
              --artifacts artifacts \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --output artifacts/latest.json
          fi
          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS-desktop.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS-desktop.txt
          )

      - name: Recheck asset collision and append to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -Fxq "$name"; then
              echo "Asset already exists and will not be overwritten: $name" >&2
              exit 1
            fi
          done < <(find artifacts -maxdepth 1 -type f -print0)
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY"
