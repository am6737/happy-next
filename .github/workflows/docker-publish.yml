name: Docker Publish
run-name: "Docker ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (vX.Y.Z)'
        required: true
        type: string
      publish_latest:
        description: 'Also update the latest Docker tag'
        required: true
        default: true
        type: boolean
      confirmation:
        description: 'Type PUBLISH-DOCKER to confirm'
        required: true
        type: string

concurrency:
  group: docker-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: kuaifan

jobs:
  preflight:
    name: Validate Docker release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate inputs and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'PUBLISH-DOCKER' ]; then
            echo 'The confirmation input must be PUBLISH-DOCKER.' >&2
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'release_tag must use the vX.Y.Z format.' >&2
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG does not exist." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: happy-server
            dockerfile: Dockerfile.server
            context: .
          - image: happy-app
            dockerfile: Dockerfile.webapp
            context: .
          - image: happy-voice
            dockerfile: packages/happy-voice/Dockerfile
            context: packages/happy-voice
          - image: happy-docs
            dockerfile: packages/happy-docs/Dockerfile
            context: packages/happy-docs
          - image: happy-web
            dockerfile: packages/happy-web/Dockerfile
            context: packages/happy-web

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
