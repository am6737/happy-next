name: GitHub Release
run-name: "GitHub Release ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (vX.Y.Z)'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH-RELEASE to confirm'
        required: true
        type: string

concurrency:
  group: github-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate inputs and unpublished Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'PUBLISH-RELEASE' ]; then
            echo 'The confirmation input must be PUBLISH-RELEASE.' >&2
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'release_tag must use the vX.Y.Z format.' >&2
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG does not exist." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android ${{ matrix.type }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - type: APK
            buildType: apk
            ext: apk
          - type: AAB
            buildType: app-bundle
            ext: aab
    defaults:
      run:
        working-directory: packages/happy-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Disable lint for CI
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint.gradle << 'GRADLE'
          allprojects {
              afterEvaluate {
                  tasks.matching { it.name.startsWith("lintVital") }.configureEach {
                      enabled = false
                  }
              }
          }
          GRADLE

      - name: Override buildType to ${{ matrix.buildType }}
        run: |
          jq '.build.production.android.buildType = "${{ matrix.buildType }}"' eas.json > eas.tmp.json
          mv eas.tmp.json eas.json

      - name: Build ${{ matrix.type }}
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          eas build --local \
            -p android \
            --profile production \
            --non-interactive \
            --output "./happy-next-${RELEASE_TAG}-android.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ matrix.ext }}
          if-no-files-found: error
          path: packages/happy-app/happy-next-${{ inputs.release_tag }}-android.${{ matrix.ext }}

  build-ios:
    name: Build iOS IPA
    needs: preflight
    runs-on: macos-26
    defaults:
      run:
        working-directory: packages/happy-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Build IPA
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          eas build --local \
            -p ios \
            --profile production \
            --non-interactive \
            --output "./happy-next-${RELEASE_TAG}-ios.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-ipa
          if-no-files-found: error
          path: packages/happy-app/happy-next-${{ inputs.release_tag }}-ios.ipa

  build-desktop-windows:
    name: Build Windows ${{ matrix.arch }} installers
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            asset_arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_script: tauri:build:windows:x64
          - arch: ARM64
            asset_arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            build_script: tauri:build:windows:arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck and test app
        run: |
          yarn workspace happy-app typecheck
          yarn workspace happy-app test --run

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required secret: TAURI_SIGNING_PRIVATE_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing required secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          }

      - name: Build unsigned MSI and NSIS installers
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-version.json'
          @{ version = $env:APP_VERSION } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 $configPath
          yarn workspace happy-app ${{ matrix.build_script }} --ci --config $configPath
          $bundle = "packages/happy-app/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          $installers = @(Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' })
          if ($installers.Count -eq 0) {
            throw 'No Windows installers were produced'
          }
          $wrongVersions = @($installers | Where-Object { $_.Name -notmatch [regex]::Escape($env:APP_VERSION) })
          if ($wrongVersions.Count -gt 0) {
            throw "Windows installer version mismatch: $($wrongVersions.Name -join ', ')"
          }

      - name: Stage normalized Windows artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $bundle = "packages/happy-app/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          $stage = "packages/happy-app/desktop-release-artifacts"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter '*.exe')
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter '*.msi')
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw 'Expected exactly one NSIS installer and one MSI installer'
          }

          $nsisTarget = Join-Path $stage "happy-next-$env:RELEASE_TAG-windows-${{ matrix.asset_arch }}-setup.exe"
          $msiTarget = Join-Path $stage "happy-next-$env:RELEASE_TAG-windows-${{ matrix.asset_arch }}.msi"
          Copy-Item $nsis[0].FullName $nsisTarget
          Copy-Item $msi[0].FullName $msiTarget

          if (!(Test-Path "$($nsis[0].FullName).sig") -or !(Test-Path "$($msi[0].FullName).sig")) {
            throw 'Missing Windows updater signature'
          }
          Copy-Item "$($nsis[0].FullName).sig" "$nsisTarget.sig"
          Copy-Item "$($msi[0].FullName).sig" "$msiTarget.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.asset_arch }}
          if-no-files-found: error
          path: packages/happy-app/desktop-release-artifacts/*

  build-desktop-macos:
    name: Build signed and notarized macOS Universal bundle
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Verify macOS 26 SDK
        run: |
          set -euo pipefail
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Using macOS SDK ${SDK_VERSION}"
          test "${SDK_VERSION%%.*}" = '26'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck and test app
        run: |
          yarn workspace happy-app typecheck
          yarn workspace happy-app test --run

      - name: Validate macOS signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            ASC_API_KEY_ID \
            ASC_API_KEY_P8_BASE64 \
            ASC_ISSUER_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/happy-next-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

      - name: Prepare App Store Connect key for notarization
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

      - name: Build, sign, and notarize macOS Universal bundle
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          jq -n --arg version "$APP_VERSION" '{version: $version}' > "$RUNNER_TEMP/tauri-version.json"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          yarn workspace happy-app tauri:build:macos:universal --ci --config "$RUNNER_TEMP/tauri-version.json"

      - name: Notarize and staple macOS disk image
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify signature, version, notarization, stapling, and Gatekeeper
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" && test -n "$DMG_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "$APP_VERSION"
          basename "$DMG_PATH" | grep -Fq "_${APP_VERSION}_"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Stage normalized macOS artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle"
          STAGE_DIR="packages/happy-app/desktop-release-artifacts"
          APP_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          UPDATER_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$APP_PATH" && test -n "$DMG_PATH" && test -n "$UPDATER_PATH"
          test -f "${UPDATER_PATH}.sig"

          mkdir -p "$STAGE_DIR"
          ditto -c -k --keepParent "$APP_PATH" \
            "$STAGE_DIR/happy-next-${RELEASE_TAG}-macos-universal.zip"
          cp "$DMG_PATH" \
            "$STAGE_DIR/happy-next-${RELEASE_TAG}-macos-universal.dmg"
          cp "$UPDATER_PATH" \
            "$STAGE_DIR/happy-next-${RELEASE_TAG}-macos-universal.app.tar.gz"
          cp "${UPDATER_PATH}.sig" \
            "$STAGE_DIR/happy-next-${RELEASE_TAG}-macos-universal.app.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          if-no-files-found: error
          path: packages/happy-app/desktop-release-artifacts/*

      - name: Remove temporary signing material
        if: always()
        env:
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/happy-next-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  create-release:
    name: Create GitHub Release
    needs:
      - preflight
      - build-android
      - build-ios
      - build-desktop-macos
      - build-desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater manifest, metadata, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq '.body' > "$RUNNER_TEMP/release-notes.md"

          node packages/happy-app/sources/scripts/generateDesktopUpdateManifest.cjs \
            --version "$VERSION" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts artifacts \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --output artifacts/latest.json

          jq -n \
            --arg version "$VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            '{version: $version, release_tag: $release_tag, source_sha: $source_sha}' \
            > "artifacts/happy-next-${RELEASE_TAG}-desktop-metadata.json"

          (
            cd artifacts
            find . -maxdepth 1 -type f \
              ! -name "happy-next-${RELEASE_TAG}-sha256sums.txt" \
              -print0 |
              sort -z |
              xargs -0 sha256sum > "happy-next-${RELEASE_TAG}-sha256sums.txt"
          )

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ "$name" != 'latest.json' ] && ! printf '%s' "$name" | grep -Eq "^happy-next-${RELEASE_TAG}-"; then
              echo "Unexpected release asset name: $name" >&2
              exit 1
            fi
          done < <(find artifacts -maxdepth 1 -type f -print0)

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            artifacts/*
