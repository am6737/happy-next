name: Release
run-name: "${{ inputs.version && format('[Manual] Release {0}', inputs.version) || format('[Auto] Release {0}', github.ref_name) }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '[iOS App Store] App version to submit (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  # ── Tag push: build mobile + desktop artifacts → GitHub Release ──

  build-android:
    name: Build Android ${{ matrix.type }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - type: APK
            buildType: apk
            ext: apk
          - type: AAB
            buildType: app-bundle
            ext: aab
    defaults:
      run:
        working-directory: packages/happy-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Disable lint for CI
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint.gradle << 'GRADLE'
          allprojects {
              afterEvaluate {
                  tasks.matching { it.name.startsWith("lintVital") }.configureEach {
                      enabled = false
                  }
              }
          }
          GRADLE

      - name: Override buildType to ${{ matrix.buildType }}
        run: |
          jq '.build.production.android.buildType = "${{ matrix.buildType }}"' eas.json > eas.tmp.json && mv eas.tmp.json eas.json

      - name: Build ${{ matrix.type }}
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: eas build --local -p android --profile production --non-interactive --output ./happy-${{ github.ref_name }}.${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.ext }}
          path: packages/happy-app/happy-${{ github.ref_name }}.${{ matrix.ext }}

  build-ios:
    name: Build iOS IPA
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    defaults:
      run:
        working-directory: packages/happy-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Build IPA
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: eas build --local -p ios --profile production --non-interactive --output ./happy-${{ github.ref_name }}.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: packages/happy-app/happy-${{ github.ref_name }}.ipa

  build-desktop-windows:
    name: Build Windows ${{ matrix.arch }} installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_script: tauri:build:windows:x64
          - arch: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            build_script: tauri:build:windows:arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck and test app
        run: |
          yarn workspace happy-app typecheck
          yarn workspace happy-app test --run

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required secret: TAURI_SIGNING_PRIVATE_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing required secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          }

      - name: Build unsigned MSI and NSIS installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $env:APP_VERSION = $version
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-version.json'
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 $configPath
          yarn workspace happy-app ${{ matrix.build_script }} --ci --config $configPath
          $bundle = "packages/happy-app/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          $installers = @(Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' })
          if ($installers.Count -eq 0) {
            throw 'No Windows installers were produced'
          }
          $wrongVersions = @($installers | Where-Object { $_.Name -notmatch [regex]::Escape($version) })
          if ($wrongVersions.Count -gt 0) {
            throw "Windows installer version mismatch: $($wrongVersions.Name -join ', ')"
          }

      - name: Stage Windows release artifacts
        shell: pwsh
        run: |
          $bundle = "packages/happy-app/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          $stage = "packages/happy-app/desktop-release-artifacts"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Name -match '\.(msi|exe|zip|sig)$' } |
            Copy-Item -Destination $stage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: packages/happy-app/desktop-release-artifacts/*

  build-desktop-macos:
    name: Build signed and notarized macOS Universal bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck and test app
        run: |
          yarn workspace happy-app typecheck
          yarn workspace happy-app test --run

      - name: Validate macOS signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            ASC_API_KEY_ID \
            ASC_API_KEY_P8_BASE64 \
            ASC_ISSUER_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/happy-next-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

      - name: Prepare App Store Connect key for notarization
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

      - name: Build, sign, and notarize macOS Universal bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          export APP_VERSION="$version"
          jq -n --arg version "$version" '{version: $version}' > "$RUNNER_TEMP/tauri-version.json"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          yarn workspace happy-app tauri:build:macos:universal --ci --config "$RUNNER_TEMP/tauri-version.json"

      - name: Notarize and staple macOS disk image
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify signature, notarization, stapling, and Gatekeeper
        run: |
          version="${GITHUB_REF_NAME#v}"
          APP_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" && test -n "$DMG_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "$version"
          basename "$DMG_PATH" | grep -Fq "_${version}_"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Package macOS application archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          APP_PATH="$(find packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --keepParent "$APP_PATH" \
            "packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/Happy-Next-${version}-macOS-universal.zip"

      - name: Stage macOS release artifacts
        run: |
          BUNDLE_DIR="packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle"
          STAGE_DIR="packages/happy-app/desktop-release-artifacts"
          mkdir -p "$STAGE_DIR"
          find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -exec cp {} "$STAGE_DIR" \;
          find "$BUNDLE_DIR" -maxdepth 1 -type f -name 'Happy-Next-*-macOS-universal.zip' -exec cp {} "$STAGE_DIR" \;
          find "$BUNDLE_DIR/macos" -maxdepth 1 -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} "$STAGE_DIR" \;

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          if-no-files-found: error
          path: packages/happy-app/desktop-release-artifacts/*

      - name: Remove temporary signing material
        if: always()
        env:
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/happy-next-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-desktop-macos, build-desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub Release ${{ github.ref_name }} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          if find artifacts -maxdepth 1 -type f -name '*.sig' -print -quit | grep -q .; then
            node packages/happy-app/sources/scripts/generateDesktopUpdateManifest.cjs \
              --version "${{ github.ref_name }}" \
              --repository "$GITHUB_REPOSITORY" \
              --artifacts artifacts \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --output artifacts/latest.json
          fi
          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            artifacts/*

  # ── Manual trigger: iOS → App Store ──

  submit-ios:
    name: iOS → App Store
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    defaults:
      run:
        working-directory: packages/happy-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Build iOS
        env:
          APP_VERSION: ${{ inputs.version }}
        run: eas build --local -p ios --profile production --non-interactive --output ./happy.ipa

      - name: Prepare ASC API Key
        run: echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > /tmp/AuthKey.p8

      - name: Submit to App Store
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          jq --arg keyId "$ASC_API_KEY_ID" --arg issuerId "$ASC_ISSUER_ID" \
            '.submit.production.ios += {
              "ascApiKeyPath": "/tmp/AuthKey.p8",
              "ascApiKeyId": $keyId,
              "ascApiKeyIssuerId": $issuerId
            }' eas.json > eas.tmp.json && mv eas.tmp.json eas.json

          eas submit -p ios --profile production --path ./happy.ipa --non-interactive
