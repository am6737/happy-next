name: Desktop CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/happy-app/**'
      - 'packages/happy-wire/**'
      - 'yarn.lock'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/happy-app/**'
      - 'packages/happy-wire/**'
      - 'yarn.lock'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-universal:
    name: macOS 12+ Universal
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck app
        run: yarn workspace happy-app typecheck

      - name: Test app
        run: yarn workspace happy-app test --run

      - name: Build unsigned macOS Universal bundles
        run: yarn workspace happy-app tauri:build:macos:universal --ci --no-sign

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal-unsigned
          if-no-files-found: error
          path: |
            packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            packages/happy-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build happy-wire
        run: yarn workspace happy-wire build

      - name: Typecheck app
        run: yarn workspace happy-app typecheck

      - name: Test app
        run: yarn workspace happy-app test --run

      - name: Build unsigned Windows x64 installers
        run: yarn workspace happy-app tauri:build:windows:x64 --ci --no-sign

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-unsigned
          if-no-files-found: error
          path: |
            packages/happy-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            packages/happy-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
