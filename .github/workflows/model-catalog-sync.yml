name: Model catalog sync

# Daily sync of packages/happy-wire/src/modelCatalog.json from the upstream
# model lists (Codex CLI model/list, basellm/llm-metadata for Claude, Gemini
# CLI). No API keys are needed. Changes land as one pull request on a
# fixed branch; merging it publishes the catalog, since happy-server serves it
# from main. The Codex CLI version (codexCli) is updated by hand only — the
# sync never changes it and this workflow refuses a result that does.
#
# Requires "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General).

on:
    schedule:
        - cron: '0 1 * * *' # 09:00 Asia/Shanghai
    workflow_dispatch:

concurrency:
    group: model-catalog-sync
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CATALOG: packages/happy-wire/src/modelCatalog.json
            SYNC_BRANCH: automation/model-catalog-sync
            REPORT: /tmp/model-catalog-report.md
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Sync model catalog
              id: sync
              run: yarn workspace happy-wire sync-models --report "$REPORT"

            - name: Check the sync only changed the catalog, and not codexCli
              if: steps.sync.outputs.changed == 'true'
              run: |
                  unexpected=$(git status --porcelain | grep -v " $CATALOG\$" || true)
                  if [ -n "$unexpected" ]; then
                      echo "::error::The sync changed files other than $CATALOG:"
                      echo "$unexpected"
                      exit 1
                  fi
                  node -e '
                      const { execSync } = require("node:child_process");
                      const file = process.env.CATALOG;
                      const before = JSON.parse(execSync(`git show HEAD:${file}`)).codexCli;
                      const after = require(`./${file}`).codexCli;
                      if (JSON.stringify(before) !== JSON.stringify(after)) {
                          console.error("::error::codexCli changed — the Codex CLI version is updated by hand only.");
                          process.exit(1);
                      }
                  '

            - name: Test happy-wire with the synced catalog
              id: test
              if: steps.sync.outputs.changed == 'true'
              continue-on-error: true
              run: yarn workspace happy-wire test

            - name: Note failing tests in the pull request
              if: steps.sync.outputs.changed == 'true' && steps.test.outcome == 'failure'
              run: |
                  {
                      echo
                      echo '> [!WARNING]'
                      echo "> \`yarn workspace happy-wire test\` fails with this catalog — tests that pin catalog data need updating before merge. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
                  } >> "$REPORT"

            - name: Open or update the pull request
              if: steps.sync.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  title="chore(models): sync model catalog"
                  # Someone pushed review fixes to the open sync PR: don't overwrite them.
                  if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null \
                      && [ "$(gh pr view "$SYNC_BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
                      git fetch origin "$SYNC_BRANCH"
                      if git log "origin/main..origin/$SYNC_BRANCH" --format='%an' | grep -qv '^github-actions\[bot\]$'; then
                          echo "::warning::$SYNC_BRANCH has manual commits; leaving the open pull request as is."
                          exit 0
                      fi
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
                  git checkout -B "$SYNC_BRANCH"
                  git add "$CATALOG"
                  git commit -m "$title"
                  git push --force origin "$SYNC_BRANCH"
                  if [ "$(gh pr view "$SYNC_BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
                      gh pr edit "$SYNC_BRANCH" --title "$title" --body-file "$REPORT"
                  else
                      gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body-file "$REPORT"
                  fi

            - name: Summary
              if: always()
              run: |
                  if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
