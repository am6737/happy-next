[package]
name = "app"
version = "2.0.0"
description = "Happy Next desktop client"
authors = ["Hitosea"]
license = "MIT"
repository = "https://github.com/hitosea/happy-next"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.9.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "=2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=2.3.3", default-features = false, features = ["platform-macos"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=2.3.3", default-features = false, features = ["platform-windows"] }
