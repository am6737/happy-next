[package]
name = "app"
version = "2.0.0"
description = "Happy Next desktop client"
authors = ["Hitosea"]
license = "MIT"
repository = "https://github.com/hitosea/happy-next"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
log = "0.4"
notify-rust = "=4.18.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.9.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "=2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.1", default-features = false, features = ["NSApplication"] }
tauri-plugin-notifications = { version = "=0.4.6", default-features = false }
