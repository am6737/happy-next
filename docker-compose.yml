services:
  happy-app:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        APP_VERSION: ${APP_VERSION:-2.0.0}
    ports:
      - "3030:80"
    restart: unless-stopped
    environment:
      # API server (separate origin; do not use path reverse proxy)
      - EXPO_PUBLIC_HAPPY_SERVER_URL=${EXPO_PUBLIC_HAPPY_SERVER_URL:-http://localhost:3031}
      # For docker-compose, happy-voice must call happy-server by container DNS, not host localhost.
      - EXPO_PUBLIC_VOICE_TOOL_BRIDGE_BASE_URL=${EXPO_PUBLIC_VOICE_TOOL_BRIDGE_BASE_URL:-http://happy-server:3031}

  happy-server:
    build: &happy-server-build
      context: .
      dockerfile: Dockerfile.server
    command: ["yarn", "--cwd", "packages/happy-server", "start"]
    ports:
      - "3031:3031"
    restart: unless-stopped
    environment:
      # Server
      - NODE_ENV=production
      - PORT=3031
      # Internal metrics are scraped only by the optional monitoring profile.
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - HANDY_MASTER_SECRET=${HANDY_MASTER_SECRET}
      - APP_URL=${APP_URL:-http://localhost:3030}
      # Explicit WebAuthn configuration; empty RP/origin keep WebAuthn disabled.
      - AI_WEBAUTHN_RP_ID=${AI_WEBAUTHN_RP_ID:-}
      - AI_WEBAUTHN_ORIGIN=${AI_WEBAUTHN_ORIGIN:-}
      # Public Ed25519 SPKI only. Keep the operator private key outside this stack.
      - AI_WEBAUTHN_TRUST_PUBLIC_KEY_SPKI=${AI_WEBAUTHN_TRUST_PUBLIC_KEY_SPKI:-}
      # Public service discovery (/v1/app-config)
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}
      - PUBLIC_VOICE_BASE_URL=${PUBLIC_VOICE_BASE_URL}
      # Model catalog source served at /v1/model-catalog (blank = GitHub main, `off` = bundled)
      - MODEL_CATALOG_URL=${MODEL_CATALOG_URL}
      # Server-side DooPush notification relay.
      - DOOPUSH_APP_ID=${DOOPUSH_APP_ID}
      - DOOPUSH_APP_SECRET=${DOOPUSH_APP_SECRET}
      - DOOPUSH_BASE_URL=${DOOPUSH_BASE_URL:-https://doopush.com/api/v1}
      # Shared with happy-voice. Used to sign short-lived voice bearer tokens.
      - VOICE_AUTH_SECRET=${VOICE_AUTH_SECRET:-dev-voice-auth-secret-change-me-32-bytes}
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Budget these per replica; reserve capacity for jobs and administration.
      - AI_DB_POOL_MAX=${AI_DB_POOL_MAX:-10}
      - AI_DB_READ_CONCURRENCY=${AI_DB_READ_CONCURRENCY:-64}
      # Redis
      - REDIS_URL=redis://redis:6379
      # S3 / MinIO
      - S3_HOST=minio
      - S3_PORT=9000
      - S3_USE_SSL=false
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      # GitHub OAuth App
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URL=${GITHUB_REDIRECT_URL}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # Voice tool bridge
      - VOICE_TOOL_BRIDGE_KEY=${VOICE_TOOL_BRIDGE_KEY:-dev-voice-bridge-key}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Run explicitly after backup/restore validation, before starting the API:
  # docker compose --profile maintenance run --rm happy-server-migrate
  happy-server-migrate:
    profiles: ["maintenance"]
    build: *happy-server-build
    command: ["yarn", "--cwd", "packages/happy-server", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  happy-voice:
    build:
      context: ./packages/happy-voice
      dockerfile: Dockerfile
    ports:
      - "3040:3040"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3040
      # Same value as happy-server's PUBLIC_VOICE_BASE_URL (voiceBaseUrl for the app).
      # Empty → the gateway derives it per-request from forwarded headers.
      - PUBLIC_VOICE_BASE_URL=${PUBLIC_VOICE_BASE_URL}
      # App-facing auth: API-signed short-lived bearer tokens.
      - VOICE_AUTH_SECRET=${VOICE_AUTH_SECRET:-dev-voice-auth-secret-change-me-32-bytes}
      # 火山 RTC — MUST be an "AI agent" type RTC app
      - VOLC_RTC_APP_ID=${VOLC_RTC_APP_ID}
      - VOLC_RTC_APP_KEY=${VOLC_RTC_APP_KEY}
      # 火山 OpenAPI signing (IAM access key — StartVoiceChat / StopVoiceChat)
      - VOLC_ACCESS_KEY_ID=${VOLC_ACCESS_KEY_ID}
      - VOLC_SECRET_ACCESS_KEY=${VOLC_SECRET_ACCESS_KEY}
      - VOLC_RTC_REGION=${VOLC_RTC_REGION:-cn-north-1}
      - VOLC_RTC_API_VERSION=${VOLC_RTC_API_VERSION:-2025-06-01}
      # ASR (seed big-model streaming; auth bound to the agent RTC app)
      - VOLC_ASR_RESOURCE_ID=${VOLC_ASR_RESOURCE_ID:-volc.seedasr.sauc.duration}
      # LLM (Doubao via built-in ArkV3)
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-seed-2-0-lite-260428}
      - LLM_THINKING_TYPE=${LLM_THINKING_TYPE:-disabled}
      # Unified voice/speaker — live agent TTS + message-playback TTS
      - VOLC_TTS_VOICE=${VOLC_TTS_VOICE:-zh_female_vv_uranus_bigtts}
      # Agent TTS (bidirectional streaming for the live conversation). seed-tts-2.0
      # is required for the multilingual voices (uranus).
      - VOLC_AGENT_TTS_RESOURCE_ID=${VOLC_AGENT_TTS_RESOURCE_ID:-seed-tts-2.0}
      # Message-playback TTS (one-shot/streamed REST synthesis)
      - VOLC_TTS_APP_ID=${VOLC_TTS_APP_ID}
      - VOLC_TTS_TOKEN=${VOLC_TTS_TOKEN}
      - VOLC_TTS_CLUSTER=${VOLC_TTS_CLUSTER:-volcano_tts}
      # Pre-TTS text cleaning (LLM via Ark, regex fallback)
      - ARK_API_KEY=${ARK_API_KEY}
      - TTS_CLEAN_LLM=${TTS_CLEAN_LLM:-true}
      - TTS_CLEAN_MODEL=${TTS_CLEAN_MODEL:-doubao-seed-2-0-lite-260428}
      # Defaults
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-zh}
      - AGENT_WELCOME_MESSAGE=${AGENT_WELCOME_MESSAGE:-你好，需要我做点什么？}

  # Opt-in local monitoring. No Alertmanager or external notification receiver.
  # docker compose --profile monitoring up -d prometheus
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/ai-team-alerts.yml:/etc/prometheus/ai-team-alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      happy-server:
        condition: service_started

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    ports:
      - "3050:9000"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    entrypoint: /bin/sh
    command: >
      -c "until mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\"; do sleep 2; done;
          mc mb -p \"local/$${S3_BUCKET}\" || true;
          mc anonymous set download \"local/$${S3_BUCKET}\""

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
