<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: #101827; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .stage {
    width: min(100vw, 1100px); aspect-ratio: 16/9; position: relative;
    border-radius: 22px; overflow: hidden; box-shadow: 0 28px 80px #0008;
    background: #9ddcf0;
  }
  svg { display: block; width: 100%; height: 100%; }
  .title { position: absolute; left: 28px; top: 24px; color: #173044; letter-spacing: .08em; font-size: clamp(12px, 1.5vw, 16px); font-weight: 800; }
  .subtitle { position: absolute; left: 29px; top: 48px; color: #28546b; font-size: clamp(10px, 1.15vw, 13px); }
  .hint { position: absolute; right: 24px; bottom: 18px; color: #17445d; font-size: 11px; opacity: .7; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: roll 1.25s linear infinite; }
  .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .75s linear infinite; }
  .bird { transform-box: fill-box; transform-origin: 50% 92%; animation: bob .75s ease-in-out infinite; }
  .wing { transform-box: fill-box; transform-origin: 82% 88%; animation: flap 1.5s ease-in-out infinite; }
  .cloud { animation: drift 22s linear infinite; }
  .cloud.slow { animation-duration: 31s; animation-delay: -12s; }
  @keyframes roll { to { transform: rotate(360deg); } }
  @keyframes pedal { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes flap { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-14deg); } }
  @keyframes drift { from { transform: translateX(-18%); } to { transform: translateX(115%); } }
</style>
</head>
<body>
<div class="stage" role="img" aria-label="一只戴着帽子的鹈鹕骑着自行车沿海边公路前进">
  <div class="title">PELICAN EXPRESS</div>
  <div class="subtitle">海风正好 · 出发去看日落</div>
  <div class="hint">SVG / CSS motion</div>
  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83cfea"/><stop offset="1" stop-color="#eaf7ed"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45b4c3"/><stop offset="1" stop-color="#8ed5cf"/></linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#596b73"/><stop offset="1" stop-color="#2f404a"/></linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <rect width="960" height="540" fill="url(#sky)"/>
    <circle cx="785" cy="105" r="57" fill="#ffd77b" opacity=".82"/>
    <g class="cloud" fill="#fff" opacity=".75"><ellipse cx="150" cy="130" rx="72" ry="22"/><ellipse cx="207" cy="125" rx="49" ry="29"/><ellipse cx="95" cy="135" rx="42" ry="18"/></g>
    <g class="cloud slow" fill="#fff" opacity=".48"><ellipse cx="610" cy="175" rx="70" ry="17"/><ellipse cx="662" cy="168" rx="41" ry="23"/><ellipse cx="566" cy="180" rx="35" ry="14"/></g>
    <path d="M0 305 Q140 250 290 306 T600 300 T960 286 V390 H0Z" fill="url(#sea)"/>
    <path d="M0 350 Q170 324 335 351 T690 349 T960 338 V420 H0Z" fill="#d8efd3"/>
    <g fill="#2f8c84" opacity=".65"><path d="M78 349 q10-45 20 0q12-62 24 0q13-42 25 0z"/><path d="M840 344 q9-48 19 0q13-55 25 0q14-38 24 0z"/></g>
    <path d="M0 397 Q230 370 480 399 T960 388 V540 H0Z" fill="url(#road)"/>
    <path d="M0 431 Q230 405 480 433 T960 422" stroke="#f4d783" stroke-width="6" stroke-dasharray="38 26" fill="none" opacity=".9"/>
    <ellipse cx="490" cy="470" rx="212" ry="28" fill="#15333e" opacity=".28" filter="url(#soft)"/>

    <!-- bicycle -->
    <g fill="none" stroke="#f5f0df" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="355" cy="423" r="59"/><circle cx="610" cy="423" r="59"/>
      <path d="M355 423 L435 347 L510 423 L355 423 M435 347 L470 423 M510 423 L545 344 L610 423 M545 344 L573 344"/>
      <path d="M418 347 L447 347" stroke-width="9"/>
    </g>
    <g class="wheel" fill="none" stroke="#f5f0df" stroke-width="2.4" opacity=".55">
      <circle cx="355" cy="423" r="48"/><path d="M355 375v96M307 423h96M321 389l68 68M389 389l-68 68"/>
      <circle cx="610" cy="423" r="48"/><path d="M610 375v96M562 423h96M576 389l68 68M644 389l-68 68"/>
    </g>
    <g class="pedal" stroke="#f5f0df" stroke-width="5" fill="none"><circle cx="470" cy="423" r="15"/><path d="M470 423l-20-17M470 423l23 13"/><path d="M443 403h-20M493 441h20" stroke-width="7"/></g>

    <!-- rider -->
    <g class="bird">
      <!-- legs -->
      <path d="M471 322 Q466 370 450 404" fill="none" stroke="#ef9b50" stroke-width="13" stroke-linecap="round"/>
      <path d="M500 323 Q505 367 493 414" fill="none" stroke="#ef9b50" stroke-width="13" stroke-linecap="round"/>
      <path d="M444 404 l-21 4 M493 414 l22 4" fill="none" stroke="#ef9b50" stroke-width="8" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="485" cy="276" rx="78" ry="78" fill="#f4f0dc" stroke="#374957" stroke-width="5"/>
      <path d="M426 277 Q455 244 495 250 Q524 255 541 289 Q510 315 469 313 Q440 308 426 277Z" fill="#dbe4da"/>
      <!-- wing -->
      <path class="wing" d="M486 256 Q543 248 557 285 Q536 319 491 304 Q470 290 486 256Z" fill="#b7cfc9" stroke="#374957" stroke-width="5"/>
      <path d="M501 274 q23 10 35 2 M493 287 q23 11 39 4" fill="none" stroke="#89aaa9" stroke-width="4" stroke-linecap="round"/>
      <!-- neck and head -->
      <path d="M449 234 Q437 202 458 177" fill="none" stroke="#f4f0dc" stroke-width="37" stroke-linecap="round"/>
      <ellipse cx="456" cy="162" rx="47" ry="42" fill="#f4f0dc" stroke="#374957" stroke-width="5"/>
      <!-- beak -->
      <path d="M423 170 Q382 165 342 186 Q383 207 429 190Z" fill="#eaa45e" stroke="#374957" stroke-width="5"/>
      <path d="M344 186 Q381 188 423 180" fill="none" stroke="#c4773f" stroke-width="3"/>
      <circle cx="470" cy="151" r="7" fill="#253640"/><circle cx="472" cy="148" r="2" fill="#fff"/>
      <!-- cap -->
      <path d="M418 123 Q452 91 490 118 L500 135 L422 138Z" fill="#e7584f" stroke="#374957" stroke-width="5"/>
      <path d="M407 133 Q458 127 505 140" fill="none" stroke="#374957" stroke-width="8" stroke-linecap="round"/>
      <circle cx="459" cy="102" r="7" fill="#ffd36d"/>
    </g>
    <g fill="#fff" opacity=".75"><circle cx="270" cy="284" r="4"/><circle cx="284" cy="278" r="2.5"/><circle cx="700" cy="305" r="3"/></g>
  </svg>
</div>
</body>
</html>
